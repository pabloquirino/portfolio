<section class="max-w-7xl">

    <h2
        class="text-4xl lg:text-5xl font-semibold tracking-widest mt-12 mb-10 bg-gradient-to-r from-blue-900 to-blue-500 bg-clip-text text-transparent">
        STACK
    </h2>

    <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3 mb-12">
        @for (group of groups; track group.title) {
            <div
                class="group rounded-xl border border-white/10 bg-white/[0.03] p-4 transition hover:border-blue-500/40 hover:bg-white/[0.06]">
                <h3 class="flex items-center gap-2 text-sm font-semibold uppercase tracking-wider text-white/80 mb-3">
                    <span class="text-base">{{ group.emoji }}</span>
                    {{ group.title }}
                </h3>

                <ul class="flex flex-wrap gap-1.5">
                    @for (skill of group.skills; track skill.name) {
                        <li
                            class="flex items-center gap-1.5 rounded-md border border-white/10 bg-white/5 px-2 py-1 text-xs lg:text-sm text-white/85 transition hover:border-blue-500/50 hover:text-white">
                            @if (skill.icon) {
                                <img class="w-4 h-4 object-contain" [src]="'/assets/skills/' + skill.icon" [alt]="skill.name">
                            }
                            <span>{{ skill.name }}</span>
                        </li>
                    }
                </ul>
            </div>
        }
    </div>

</section>
